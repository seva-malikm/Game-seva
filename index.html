<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یاری مەتەڵی ژمارەکان - Pro Puzzle</title>
  
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top left, #0f172a, #1e1b4b, #020617);
      --card-bg: rgba(15, 23, 42, 0.7);
      --accent-color: #38bdf8;
      --accent-glow: 0 0 25px rgba(56, 189, 248, 0.4);
      --tile-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
      --tile-border: rgba(255, 255, 255, 0.15);
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      padding: 28px 24px;
      border-radius: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), var(--accent-glow);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 14px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stats b {
      color: var(--accent-color);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      height: 350px;
      background: rgba(0, 0, 0, 0.25);
      padding: 14px;
      border-radius: 24px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tile {
      background: var(--tile-bg);
      color: #fff;
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--tile-border);
      transition: all 0.15s ease;
    }

    .tile:active {
      transform: scale(0.92);
      background: rgba(56, 189, 248, 0.3);
      border-color: var(--accent-color);
    }

    .tile.empty {
      background: transparent;
      box-shadow: none;
      border: none;
      cursor: default;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(30, 41, 59, 0.9);
      padding: 32px 24px;
      border-radius: 28px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      border: 1px solid var(--accent-color);
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .modal h2 {
      color: #4ade80;
      margin-bottom: 12px;
    }

    .modal p {
      margin-bottom: 24px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>یاری مەتەڵی ژمارەکان</h1>
    
    <div class="stats">
      <span>کاتی بەسەرچوو: <b id="timer">00:00</b></span>
      <span>جوڵەکان: <b id="moves">0</b></span>
    </div>

    <div class="board" id="board"></div>

    <button id="shuffleBtn">تێکەڵکردنەوە و دەستپێک</button>
  </div>

  <div class="overlay" id="winOverlay">
    <div class="modal">
      <h2>پیرۆزە! 🎉</h2>
      <p id="winDetails">تۆ یارییەکەت بردەوە!</p>
      <button id="restartWinBtn">دوبارە یاری بکەرەوە</button>
    </div>
  </div>

  <script>
    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const timerEl = document.getElementById('timer');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const winOverlay = document.getElementById('winOverlay');
    const winDetails = document.getElementById('winDetails');
    const restartWinBtn = document.getElementById('restartWinBtn');

    let tiles = [];
    let moves = 0;
    let timerInterval = null;
    let secondsPassed = 0;
    let isPlaying = false;

    function initBoard() {
      tiles = Array.from({length: 15}, (_, i) => i + 1);
      tiles.push(null);
      render();
    }

    function render() {
      board.innerHTML = '';
      tiles.forEach((num, index) => {
        const tile = document.createElement('div');
        tile.classList.add('tile');
        if (num === null) {
          tile.classList.add('empty');
        } else {
          tile.innerText = num;
          tile.onclick = () => moveTile(index);
        }
        board.appendChild(tile);
      });
    }

    function moveTile(index) {
      const emptyIndex = tiles.indexOf(null);
      const validMoves = [
        index - 1, index + 1,
        index - 4, index + 4
      ];

      if (validMoves.includes(emptyIndex)) {
        if ((index % 4 === 0 && emptyIndex === index - 1) || 
            (index % 4 === 3 && emptyIndex === index + 1)) {
          return;
        }

        if (!isPlaying) startTimer();

        [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
        moves++;
        movesEl.innerText = moves;
        render();

        if (isSolved()) {
          endGame();
        }
      }
    }

    function startTimer() {
      isPlaying = true;
      clearInterval(timerInterval);
      secondsPassed = 0;
      timerInterval = setInterval(() => {
        secondsPassed++;
        const mins = String(Math.floor(secondsPassed / 60)).padStart(2, '0');
        const secs = String(secondsPassed % 60).padStart(2, '0');
        timerEl.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function shuffleTiles() {
      winOverlay.classList.remove('show');
      moves = 0;
      movesEl.innerText = 0;
      clearInterval(timerInterval);
      timerEl.innerText = '00:00';
      isPlaying = false;

      for (let i = 0; i < 200; i++) {
        const emptyIndex = tiles.indexOf(null);
        const neighbors = [];
        if (emptyIndex % 4 > 0) neighbors.push(emptyIndex - 1);
        if (emptyIndex % 4 < 3) neighbors.push(emptyIndex + 1);
        if (emptyIndex >= 4) neighbors.push(emptyIndex - 4);
        if (emptyIndex < 12) neighbors.push(emptyIndex + 4);

        const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
        [tiles[emptyIndex], tiles[randomNeighbor]] = [tiles[randomNeighbor], tiles[emptyIndex]];
      }
      render();
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      winDetails.innerText = `کاتی بەکارھاتوو: ${timerEl.innerText} | ژمارەی جوڵەکان: ${moves}`;
      winOverlay.classList.add('show');
    }

    function isSolved() {
      for (let i = 0; i < 15; i++) {
        if (tiles[i] !== i + 1) return false;
      }
      return true;
    }

    shuffleBtn.onclick = shuffleTiles;
    restartWinBtn.onclick = shuffleTiles;

    initBoard();
  </script>
</body>
</html>
