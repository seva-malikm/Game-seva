<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یاری مەتەڵی ژمارەکان - Pro Puzzle</title>
  
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #0f172a, #020617);
      --card-bg: rgba(15, 23, 42, 0.75);
      --accent-color: #facc15;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 410px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 32px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(250, 204, 21, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #e11d48, #facc15, #16a34a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.06);
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stats b {
      color: var(--accent-color);
    }

    /* پاشبنەمای تەختەی یارییەکە بە شێوازی ئاڵای کوردستان */
    .board-wrapper {
      position: relative;
      width: 100%;
      height: 350px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 22px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }

    .kurdistan-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      z-index: 1;
    }

    .flag-red {
      flex: 1;
      background: #e11d48;
    }

    .flag-white {
      flex: 1;
      background: #ffffff;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .flag-green {
      flex: 1;
      background: #16a34a;
    }

    /* خۆری کوردستان لە ناوەڕاستدا */
    .kurdistan-sun {
      position: absolute;
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, #facc15 40%, #eab308 100%);
      border-radius: 50%;
      box-shadow: 0 0 30px #facc15, 0 0 60px #facc15;
      z-index: 2;
    }

    .board {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      padding: 12px;
      z-index: 3;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .tile {
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .tile:active {
      transform: scale(0.92);
    }

    .tile.empty {
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      cursor: default;
    }

    /* ڕەنگی جیاواز و درەوشاوە بۆ هەر ژمارەیەک بە جودا */
    .t-1  { background: rgba(239, 68, 68, 0.65); }  /* سوور */
    .t-2  { background: rgba(249, 115, 22, 0.65); } /* پرتەقاڵی */
    .t-3  { background: rgba(245, 158, 11, 0.65); } /* زەرد */
    .t-4  { background: rgba(16, 185, 129, 0.65); } /* سەوز */
    .t-5  { background: rgba(6, 182, 212, 0.65); }  /* فیرۆزەیی */
    .t-6  { background: rgba(59, 130, 246, 0.65); } /* شین */
    .t-7  { background: rgba(99, 102, 241, 0.65); } /* نیللی */
    .t-8  { background: rgba(139, 92, 246, 0.65); } /* مۆر */
    .t-9  { background: rgba(217, 70, 239, 0.65); } /* پەمەیی */
    .t-10 { background: rgba(244, 63, 94, 0.65); }  /* ئاڵ */
    .t-11 { background: rgba(20, 184, 166, 0.65); } /* سەوزی ئاوی */
    .t-12 { background: rgba(234, 179, 8, 0.65); }  /* زێڕینی گەش */
    .t-13 { background: rgba(168, 85, 247, 0.65); } /* مۆری گەش */
    .t-14 { background: rgba(14, 165, 233, 0.65); } /* شینی ئاسمانی */
    .t-15 { background: rgba(34, 197, 94, 0.65); }  /* سەوزی تۆخ */

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #e11d48, #facc15, #16a34a);
      color: #0f172a;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(250, 204, 21, 0.3);
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(30, 41, 59, 0.95);
      padding: 32px 24px;
      border-radius: 28px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      border: 2px solid var(--accent-color);
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    }

    .modal h2 {
      color: #4ade80;
      margin-bottom: 12px;
    }

    .modal p {
      margin-bottom: 24px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>یاری مەتەڵی ژمارەکان</h1>
    
    <div class="stats">
      <span>کاتی بەسەرچوو: <b id="timer">00:00</b></span>
      <span>جوڵەکان: <b id="moves">0</b></span>
    </div>

    <!-- پاشبنەمای ئاڵای کوردستان -->
    <div class="board-wrapper">
      <div class="kurdistan-bg">
        <div class="flag-red"></div>
        <div class="flag-white">
          <div class="kurdistan-sun"></div>
        </div>
        <div class="flag-green"></div>
      </div>
      <div class="board" id="board"></div>
    </div>

    <button id="shuffleBtn">تێکەڵکردنەوە و دەستپێک</button>
  </div>

  <div class="overlay" id="winOverlay">
    <div class="modal">
      <h2>پیرۆزە! 🎉</h2>
      <p id="winDetails">تۆ یارییەکەت بردەوە!</p>
      <button id="restartWinBtn">دوبارە یاری بکەرەوە</button>
    </div>
  </div>

  <script>
    const board = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const timerEl = document.getElementById('timer');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const winOverlay = document.getElementById('winOverlay');
    const winDetails = document.getElementById('winDetails');
    const restartWinBtn = document.getElementById('restartWinBtn');

    let tiles = [];
    let moves = 0;
    let timerInterval = null;
    let secondsPassed = 0;
    let isPlaying = false;

    function initBoard() {
      tiles = Array.from({length: 15}, (_, i) => i + 1);
      tiles.push(null);
      render();
    }

    function render() {
      board.innerHTML = '';
      tiles.forEach((num, index) => {
        const tile = document.createElement('div');
        tile.classList.add('tile');
        if (num === null) {
          tile.classList.add('empty');
        } else {
          tile.innerText = num;
          tile.classList.add(`t-${num}`); // دانانی کلاسی ڕەنگی تایبەت بە ژمارەکە
          tile.onclick = () => moveTile(index);
        }
        board.appendChild(tile);
      });
    }

    function moveTile(index) {
      const emptyIndex = tiles.indexOf(null);
      const validMoves = [
        index - 1, index + 1,
        index - 4, index + 4
      ];

      if (validMoves.includes(emptyIndex)) {
        if ((index % 4 === 0 && emptyIndex === index - 1) || 
            (index % 4 === 3 && emptyIndex === index + 1)) {
          return;
        }

        if (!isPlaying) startTimer();

        [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
        moves++;
        movesEl.innerText = moves;
        render();

        if (isSolved()) {
          endGame();
        }
      }
    }

    function startTimer() {
      isPlaying = true;
      clearInterval(timerInterval);
      secondsPassed = 0;
      timerInterval = setInterval(() => {
        secondsPassed++;
        const mins = String(Math.floor(secondsPassed / 60)).padStart(2, '0');
        const secs = String(secondsPassed % 60).padStart(2, '0');
        timerEl.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function shuffleTiles() {
      winOverlay.classList.remove('show');
      moves = 0;
      movesEl.innerText = 0;
      clearInterval(timerInterval);
      timerEl.innerText = '00:00';
      isPlaying = false;

      for (let i = 0; i < 200; i++) {
        const emptyIndex = tiles.indexOf(null);
        const neighbors = [];
        if (emptyIndex % 4 > 0) neighbors.push(emptyIndex - 1);
        if (emptyIndex % 4 < 3) neighbors.push(emptyIndex + 1);
        if (emptyIndex >= 4) neighbors.push(emptyIndex - 4);
        if (emptyIndex < 12) neighbors.push(emptyIndex + 4);

        const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
        [tiles[emptyIndex], tiles[randomNeighbor]] = [tiles[randomNeighbor], tiles[emptyIndex]];
      }
      render();
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerInterval);
      winDetails.innerText = `کاتی بەکارھاتوو: ${timerEl.innerText} | ژمارەی جوڵەکان: ${moves}`;
      winOverlay.classList.add('show');
    }

    function isSolved() {
      for (let i = 0; i < 15; i++) {
        if (tiles[i] !== i + 1) return false;
      }
      return true;
    }

    shuffleBtn.onclick = shuffleTiles;
    restartWinBtn.onclick = shuffleTiles;

    initBoard();
  </script>
</body>
</html>
