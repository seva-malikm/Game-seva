<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یاری مەتەڵی ژمارەکان - Pro Puzzle</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.8);
      --accent-color: #38bdf8;
      --tile-bg: linear-gradient(145deg, #1f293d, #111827);
      --tile-hover: linear-gradient(145deg, #2563eb, #1d4ed8);
      --text-color: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 25px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--accent-color);
      margin-bottom: 6px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    p.desc {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #9ca3af;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #facc15;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      aspect-ratio: 1;
      margin-bottom: 20px;
    }

    .tile {
      background: var(--tile-bg);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2), 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.15s ease-in-out;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tile:active {
      transform: scale(0.95);
    }

    .tile.empty {
      background: transparent;
      box-shadow: none;
      border: none;
      cursor: default;
    }

    .tile.correct {
      border-color: rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .win-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .win-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .win-title {
      font-size: 2rem;
      color: #4ade80;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container" style="position: relative;">
    <h1>مەتەڵی ژمارەکان 🧩</h1>
    <p class="desc">ژمارەکان بە ڕێزبەندی 1 تا 15 ڕێکبخەرەوە!</p>

    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-label">جوڵەکان</span>
        <span class="stat-value" id="moves">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">کات</span>
        <span class="stat-value" id="timer">00:00</span>
      </div>
    </div>

    <div class="board" id="board"></div>

    <div class="controls">
      <button class="btn btn-primary" id="shuffleBtn">یاری نوێ 🔄</button>
    </div>

    <!-- سەرکەوتن -->
    <div class="win-overlay" id="winOverlay">
      <div class="win-title">دەستخۆش! 🎉</div>
      <p style="margin-bottom: 20px; color: #cbd5e1;" id="winDetails">تۆ مەتەڵەکەت چارەسەر کرد!</p>
      <button class="btn btn-primary" id="restartWinBtn" style="max-width: 200px;">دیسانەوە</button>
    </div>
  </div>

  <script>
    const board = document.getElementById('board');
    const movesDisplay = document.getElementById('moves');
    const timerDisplay = document.getElementById('timer');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const winOverlay = document.getElementById('winOverlay');
    const winDetails = document.getElementById('winDetails');
    const restartWinBtn = document.getElementById('restartWinBtn');

    let tiles = [];
    let moves = 0;
    let timer = 0;
    let timerInterval = null;
    let isPlaying = false;

    function startTimer() {
      clearInterval(timerInterval);
      timer = 0;
      timerDisplay.innerText = "00:00";
      timerInterval = setInterval(() => {
        timer++;
        const mins = String(Math.floor(timer / 60)).padStart(2, '0');
        const secs = String(timer % 60).padStart(2, '0');
        timerDisplay.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function initBoard() {
      tiles = Array.from({ length: 15 }, (_, i) => i + 1);
      tiles.push(null); // Empty tile
      shuffleTiles();
    }

    function shuffleTiles() {
      moves = 0;
      movesDisplay.innerText = moves;
      winOverlay.classList.remove('show');

      // Solvable shuffle algorithm
      do {
        for (let i = tiles.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        }
      } while (!isSolvable() || isSolved());

      renderBoard();
      startTimer();
      isPlaying = true;
    }

    function isSolvable() {
      let inversions = 0;
      const flat = tiles.filter(x => x !== null);
      for (let i = 0; i < flat.length; i++) {
        for (let j = i + 1; j < flat.length; j++) {
          if (flat[i] > flat[j]) inversions++;
        }
      }
      const emptyIndex = tiles.indexOf(null);
      const emptyRowFromBottom = 4 - Math.floor(emptyIndex / 4);
      if (emptyRowFromBottom % 2 === 0) {
        return inversions % 2 !== 0;
      } else {
        return inversions % 2 === 0;
      }
    }

    function renderBoard() {
      board.innerHTML = '';
      tiles.forEach((value, index) => {
        const tile = document.createElement('div');
        tile.classList.add('tile');
        if (value === null) {
          tile.classList.add('empty');
        } else {
          tile.innerText = value;
          if (value === index + 1) {
            tile.classList.add('correct');
          }
          tile.onclick = () => moveTile(index);
        }
        board.appendChild(tile);
      });
    }

    function moveTile(index) {
      if (!isPlaying) return;

      const emptyIndex = tiles.indexOf(null);
      const validMoves = [
        index - 1, // Left
        index + 1, // Right
        index - 4, // Up
        index + 4  // Down
      ];

      // Handle row boundaries for left/right
      const isSameRow = Math.floor(index / 4) === Math.floor(emptyIndex / 4);
      const isAdjacentHorizontal = isSameRow && (Math.abs(index - emptyIndex) === 1);
      const isAdjacentVertical = Math.abs(index - emptyIndex) === 4;

      if (isAdjacentHorizontal || isAdjacentVertical) {
        [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
        moves++;
        movesDisplay.innerText = moves;
        renderBoard();
        checkWin();
      }
    }

    function checkWin() {
      if (isSolved()) {
        isPlaying = false;
        clearInterval(timerInterval);
        winDetails.innerText = `تۆ بە ${moves} جوڵە و لە کاتی ${timerDisplay.innerText} یارییەکەت بردەوە!`;
        winOverlay.classList.add('show');
      }
    }

    function isSolved() {
      for (let i = 0; i < 15; i++) {
        if (tiles[i] !== i + 1) return false;
      }
      return true;
    }

    shuffleBtn.onclick = shuffleTiles;
    restartWinBtn.onclick = shuffleTiles;

    initBoard();
  </script>
</body>
</html>
